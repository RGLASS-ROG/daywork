<div class="app" id="app" data-acc>
  <div class="scrim" id="scrim"></div>
  <aside class="rail" id="rail" data-acc style="--acc:#2b59c3">
    <div class="brand"><span class="mark"><span class="ic"><svg><use href="#i-check"/></svg></span></span>Tagwerk</div>
    <label class="search"><span class="ic"><svg><use href="#i-search"/></svg></span><input id="q" type="search" placeholder="Suchen  ( / )" aria-label="Aufgaben durchsuchen" autocomplete="off"></label>
    <nav class="nav" id="nav" aria-label="Listen"></nav>
    <div class="rail-foot">
      <button class="btn-ghost strong grow" id="newList"><span class="ic"><svg><use href="#i-plus"/></svg></span>Neue Liste</button>
      <button class="sync-pill" id="syncPill" title="Synchronisierung und Einstellungen"></button>
    </div>
  </aside>

  <main class="main" id="main" data-acc>
    <header class="head">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Listen anzeigen"><span class="ic"><svg><use href="#i-menu"/></svg></span></button>
      <div class="head-titles" id="headTitles"></div>
      <div class="head-tools" id="headTools"></div>
    </header>
    <div class="scroll" id="scroll">
      <div id="banner"></div>
      <form class="add" id="addForm" autocomplete="off">
        <div class="add-row"><span class="ic"><svg><use href="#i-plus"/></svg></span><input id="addInput" placeholder="Aufgabe hinzufügen" aria-label="Aufgabe hinzufügen" enterkeyhint="done"></div>
        <div class="chips" id="addChips" hidden></div>
      </form>
      <div id="list"></div>
    </div>
  </main>

  <aside class="detail" id="detail" data-acc aria-label="Details"></aside>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="config.js"></script>
<script src="vendor/msal-browser.min.js"></script>
<script src="store.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
